{% extends "base.html" %}

{% block title %}{{ post.title }}{% endblock %}

{% block content %}
<h1>{{ post.title }}</h1>

<p><strong>Author:</strong> <em>{{ post.author_name }}</em></p>
<p><strong>Published:</strong> ({{ post.pub_date|date:"M. j, Y, P" }})</p>
<p>{{ post.content|linebreaksbr }}</p>
{% endblock %}
